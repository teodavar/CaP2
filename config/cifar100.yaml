device: cuda:0
# model: wrn28_10
model: resnet101
data_code: cifar100
num_classes: 100
log_dir: ./experiment_logs

# Weights & Biases configuration
use_wandb: True
wandb_project: ADMM-Optimization
wandb_entity: mq-sirera

# Parameters to tune
experiment_name: Uniform
sparsity_type: kernel
reassign: True
reassign_freq: 5
budget: [1,1,1,1]
input_partition: [1,1,1,1]
create_partition: True

epochs: 300
batch_size: 128
optimizer: sgd
lr_scheduler: default
learning_rate: 0.01
seed: 1234

prune_ratio: [0,0.5,0.75,0.85]
admm: True
admm_epochs: 50
rho: 0.0001
multi_rho: True
retrain_bs: 128
retrain_lr: 0.001
retrain_ep: 50
retrain_opt: default


xentropy_weight: 1.

warmup : False
warmup_lr :  0.01
warmup_epochs :  10
mix_up :  True
alpha :  0.3
smooth :  False
smooth_eps :  0
save_last_model_only: False

num_partition: 4
layer_type: regular
bn_type: masked

par_first_layer: True
comm_outsize: True
lambda_comm: 0.0001
lambda_comp: 0
load_dense_model: True
load_dense_model_file: cifar100-resnet101.pt
load_pruned_model: False